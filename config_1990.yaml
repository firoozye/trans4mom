# Momentum Transformer Project Configuration
# yfinance Era (1990-Present)

# Data Settings
data:
  exchange: "yfinance"
  since: "1990-01-01T00:00:00Z"
  timeframe: "1d"
  raw_path: "data/raw/futures_1990/" 
  processed_path: "data/processed/futures_1990_present.parquet"
  
  symbols:
    "ES=F": "S&P 500"
    "NQ=F": "Nasdaq 100"
    "RTY=F": "Russell 2000"
    "YM=F": "Dow 30"
    "^N225": "Nikkei 225"
    "^FTSE": "FTSE 100"
    "^GDAXI": "DAX Performance Index"
    "^FCHI": "CAC 40"
    "^HSI": "Hang Seng Index"
    "^AXJO": "S&P/ASX 200"
    "^SSMI": "SMI PR"
    "ZT=F": "2yr Note"
    "ZF=F": "5yr Note"
    "ZN=F": "10yr Note"
    "ZB=F": "30yr Bond"
    "CL=F": "Crude Oil"
    "NG=F": "Natural Gas"
    "RB=F": "Gasoline"
    "HO=F": "Heating Oil"
    "BZ=F": "Brent Crude"
    "QM=F": "E-mini Crude"
    "GC=F": "Gold"
    "SI=F": "Silver"
    "HG=F": "Copper"
    "PL=F": "Platinum"
    "PA=F": "Palladium"
    "ZC=F": "Corn"
    "ZW=F": "Wheat"
    "ZS=F": "Soybeans"
    "CC=F": "Cocoa"
    "KC=F": "Coffee"
    "CT=F": "Cotton"
    "SB=F": "Sugar"
    "OJ=F": "Orange Juice"
    "LE=F": "Live Cattle"
    "GF=F": "Feeder Cattle"
    "HE=F": "Lean Hogs"
    "6E=F": "EUR/USD"
    "6J=F": "JPY/USD"
    "6B=F": "GBP/USD"
    "6A=F": "AUD/USD"
    "6C=F": "CAD/USD"
    "6S=F": "CHF/USD"
    "6N=F": "NZD/USD"
    "6M=F": "MXN/USD"
    "6L=F": "BRL/USD"

# Asset Classification for Static Context
asset_map:
  EQUITY: ["ES=F", "NQ=F", "RTY=F", "YM=F", "^N225", "^FTSE", "^GDAXI", "^FCHI", "^HSI", "^AXJO", "^SSMI"]
  FIXED_INCOME: ["ZT=F", "ZF=F", "ZN=F", "ZB=F"]
  ENERGY: ["CL=F", "NG=F", "RB=F", "HO=F", "BZ=F", "QM=F"]
  METALS: ["GC=F", "SI=F", "HG=F", "PL=F", "PA=F"]
  AGRICULTURE: ["ZC=F", "ZW=F", "ZS=F", "CC=F", "KC=F", "CT=F", "SB=F", "OJ=F", "LE=F", "GF=F", "HE=F"]
  FX: ["6E=F", "6J=F", "6B=F", "6A=F", "6C=F", "6S=F", "6N=F", "6M=F", "6L=F"]

# Feature Engineering
features:
  return_windows: [1, 21, 63, 126, 252]
  macd_pairs: [[8, 24], [16, 48], [32, 96]]
  vol_span: 60
  clean_outliers: true
  outlier_threshold: 5.0

# Model Hyperparameters (Official Wood et al. 2022 Specs)
model:
  hidden_dim: 64
  num_heads: 4
  num_layers: 1
  dropout: 0.1
  seq_len: 252

# Training Hyperparameters (Exact Replication V8 - Stability)
training:
  epochs: 100
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0001
  patience: 25
  trans_cost: 0.0001
  annualization: 252.0
  seed: 42
  train_split: '2022-12-31'
  val_split: '2024-12-31'
