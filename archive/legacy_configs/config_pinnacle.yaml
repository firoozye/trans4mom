# Momentum Transformer: Pinnacle Data Continuous Linked Contracts (1990-2026)
# Replication Configuration for Wood, Roberts & Zohren (2022)

data:
  exchange: "Pinnacle Data Corp CLC (Ratio-Adjusted .RAD)"
  since: "1990-01-01T00:00:00Z"
  timeframe: "1d"
  raw_path: "data/PinnacleData/CLCDATA/"
  processed_path: "data/processed/pinnacle_futures_1990_2026.parquet"

# Asset Classification for Static Context Embeddings (5 categories)
asset_map:
  EQUITY: ["ES", "SP", "EN", "ND", "YM", "DJ", "ER", "RL", "MD", "NK", "LX", "AX", "CA", "HS", "AP", "XU"]
  FIXED_INCOME: ["US", "TY", "FB", "TU", "FF", "ED", "DT", "UB", "UZ", "GS", "CB"]
  ENERGY_METALS: ["CL", "BC", "HO", "RB", "NG", "BG", "GC", "SI", "HG", "PL", "PA"]
  AGRICULTURE: ["C_", "W_", "KW", "S_", "BO", "SM", "CC", "KC", "CT", "SB", "JO", "LC", "FC", "LH"]
  FX: ["FN", "BN", "JN", "AN", "CN", "SN", "MP", "DX"]

# Feature Engineering
features:
  return_windows: [1, 21, 63, 126, 252]
  macd_pairs: [[8, 24], [16, 48], [32, 96]]
  vol_span: 60
  clean_outliers: true
  outlier_threshold: 5.0

# Model Hyperparameters (Official Wood et al. 2022 Specs)
model:
  hidden_dim: 64
  num_heads: 4
  num_layers: 1
  dropout: 0.1
  seq_len: 252

# Training Hyperparameters (Wood et al. 2022 Benchmark)
training:
  epochs: 80
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.0001
  patience: 30
  trans_cost: 0.0001 # 1 bps turnover friction
  annualization: 252.0
  seed: 42
  train_split: '2015-12-31'  # 1990-2015 In-Sample Training (26 years)
  val_split: '2018-12-31'    # 2016-2018 Validation Set (3 years, ~10%)
                             # 2019-2026 Out-of-Sample Test Window (8 years)
